# OCR and board-typo fixes, applied before ids are derived. Keys match case-insensitively.
# Every entry here was checked against the board image. Rerun `run.py catalog` after editing:
# it fails if any entry never matched. Keys must use OCR's exact characters: OCR reads the
# bullet-like glyphs on these boards as U+2022 (•) or U+00E5 (å), not as U+FFFD.

