[[rule]]
match = '^(server rack \(full\)|network rack \(half\)|ups unit)$'
family = "appliance"
params = { kind = "rack" }
[[rule]]
match = '^paper shredder$'
family = "appliance"
params = { kind = "shredder", colour = "charcoal" }
[[rule]]
match = '^(dehumidifier|air purifier)$'
family = "appliance"
params = { kind = "box", colour = "off_white" }

# ----------------------------------------------------------------- rugs, booths, lamps -----
[[rule]]
match = '^rug \(dark\)$'
family = "rug"
params = { tone = "dark" }
[[rule]]
match = '^rug \(pattern\)$'
family = "rug"
params = { tone = "pattern" }
[[rule]]
match = '^rug \('
family = "rug"
params = { tone = "neutral" }
[[rule]]
match = '^(single phone booth|phone booth)$'
family = "booth"
params = { kind = "single" }
[[rule]]
match = '^double focus pod$'
family = "booth"
params = { kind = "double" }
[[rule]]
match = '^privacy chair pod$'
family = "booth"
params = { kind = "chair" }
[[rule]]
match = '^floor lamp$'
family = "lamp"
params = { kind = "floor" }
[[rule]]
match = '^desk lamp$'
family = "lamp"
params = { kind = "desk" }
[[rule]]
match = '^presentation light$'
family = "lamp"
params = { kind = "presentation" }

# ---------------------------------------------- fallback categories for unbuilt items -----
