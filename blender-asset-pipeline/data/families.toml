# Label -> builder family rules for `run.py catalog`; family settings read by `run.py build`.
#
# [families.<id>]  one parametric Blender builder each (../blender_kit/families/).
#   category  default catalogue category for items built by this family
#   dims      how 1-2 printed values map onto axes: "wdh" (default), "wd", "wh", "h",
#             or "wh_max" (larger value is the height: boards print partitions as "2400 x 1200").
#             Three printed values are w x d x h unless a 3-letter order says otherwise.
#   tris      triangle budget QA enforces (props 2k, furniture 10k)
#   qa_h      "exact" (default) or "min": the printed height covers only part of the asset
#             (a planter box under its foliage, a screen panel above its stand)
# [[rule]]         first match wins. `match` is a regex on the lower-case corrected name;
#                  optional `section` regex narrows it to a board section. A rule names a
#                  `family` (+ `params` for the builder) or a `kind` ("composite" = layout
#                  of parts, "reference" = catalogued with its crop but not built).
#                  Colour and variant params were read off the board artwork.
# [sections] / [boards]  category for items no family claims (first section regex wins).

[families.desk]
category = "workstation"
[families.task_chair]
category = "seating"
[families.side_chair]
category = "seating"
[families.armchair]
category = "lounge"
[families.sofa]
category = "lounge"
[families.stool]
category = "seating"
tris = 2000
[families.pouf]
category = "lounge"
dims = "wd"
tris = 2000
[families.table]
category = "meeting"
dims = "wd"
[families.cabinet]
category = "storage"
[families.shelf]
category = "storage"
[families.planter]
category = "greenery"
qa_h = "min"
qa_wd = "min"         # the printed size is the box; greenery spills over its edges
tris = 16000          # dense greenery across up to 1.8 m of trough or shelving
[families.plant]
category = "greenery"
[families.partition]
category = "partition"
dims = "wh_max"
[families.door]
category = "architecture"
dims = "wh_max"
[families.window]
category = "architecture"
dims = "wh"
[families.screen]
category = "tech"
dims = "wh"
tris = 2000
qa_h = "min"
[families.board]
category = "tech"
dims = "wh"
tris = 2000
qa_h = "min"
[families.stand]
category = "tech"
tris = 2000
[families.bin]
category = "utility"
tris = 2000
[families.appliance]
category = "utility"
[families.rug]
category = "lounge"
dims = "wd"
tris = 2000
[families.booth]
category = "architecture"
[families.lamp]
category = "lighting"
dims = "h"
tris = 2000

# ---------------------------------------------------------------- composites (layouts) ----
[[rule]]
match = '.'
section = 'kitchenette layouts|presentation setups|print station setups|entrance setups'
