# Virtual Office server on Fly.io (P3-D smoke test; see docs/DEPLOY.md).
# Deploy from the REPO ROOT: fly deploy (uses apps/server/Dockerfile).
# Created 2026-11-03 with `fly apps create meta-virtual-office --org personal`
# (the "Dibya Debashish Bhoi" org). Keep this file in sync if it changes.

app = "meta-virtual-office"
# Singapore: the fastest Fly region measured from the owner's machine on 2026-11-03 (Mumbai,
# `bom`, was faster but Fly no longer provisions there). The database must sit in the same
# region (Supabase ap-southeast-1); see docs/HANDOFF.md section 0.
primary_region = "sin"

[build]
  dockerfile = "apps/server/Dockerfile"

# Stamped at deploy time so /health reports the deployed commit:
#   fly deploy --build-arg GIT_COMMIT=$(git rev-parse --short HEAD)
[build.args]
  GIT_COMMIT = "unset"

[env]
  PORT = "8080"
  # Smoke test only: dev auth. P4-A switches this to supabase with NODE_ENV=production.
  AUTH_MODE = "dev"
  # Empty until the web URL exists (server then allows any origin); after the
  # web deploy, set this to the Vercel URL and redeploy (docs/DEPLOY.md).
  ALLOWED_ORIGINS = "https://meta-virtual-office.vercel.app,https://meta-virtual-office-debashish17s-projects.vercel.app"

# One long-lived process; Fly's http_service upgrades to WebSocket, so the
# Colyseus room needs no extra proxy config. force_https keeps wss:// working.
[http_service]
  internal_port = 8080
  force_https = true
  # Always on (owner, 2026-11-04): Fly's idle check does not count the open WebSocket
  # connections, so auto-stop killed the machine every ~5 minutes with people online and
  # wiped the in-memory demo. One machine stays up; reset the demo with
  # `fly apps restart meta-virtual-office`.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
